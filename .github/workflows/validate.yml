# Purpose: .github / workflows / validate module.
#
# Table of contents:
# 1. Workflow or configuration
# End file heading

name: Validate

on:
  workflow_call:
    outputs:
      release-notes:
        description: Validated changelog text for the release
        value: ${{ jobs.validate.outputs.release-notes }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-notes: ${{ steps.release-notes.outputs.notes }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting, lint, types, and unused code
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Build and run offline browser tests
        run: npm run test:ui

      - name: Verify release version and extract changelog
        id: release-notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          notes=$(node scripts/release-notes.mjs "$GITHUB_REF_NAME")
          delimiter="release_notes_${RANDOM}_${RANDOM}"
          {
            printf 'notes<<%s\n' "$delimiter"
            printf '%s\n' "$notes"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          retention-days: 7
          if-no-files-found: error
