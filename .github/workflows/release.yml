name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ needs.validate.outputs.release-notes }}
        run: |
          test -s dist/wpvg_assessor.min.js
          test -s dist/wpvg_assessor.user.js
          test -n "$RELEASE_NOTES"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/wpvg_assessor.min.js \
              dist/wpvg_assessor.user.js \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WikiProject Video games Assessor ${RELEASE_TAG#v}" \
              --notes "$RELEASE_NOTES" \
              --draft=false \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              dist/wpvg_assessor.min.js \
              dist/wpvg_assessor.user.js \
              --repo "$GITHUB_REPOSITORY" \
              --title "WikiProject Video games Assessor ${RELEASE_TAG#v}" \
              --notes "$RELEASE_NOTES" \
              --verify-tag
          fi
